<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="128" fill="#040308"/>
  <defs>
    <linearGradient id="cyberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <filter id="neonFilter">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Cybernetic Hex Core -->
  <polygon points="256,64 432,160 432,352 256,448 80,352 80,160" fill="none" stroke="url(#cyberGlow)" stroke-width="16" filter="url(#neonFilter)"/>
  <!-- Central 'E' Glyph with Laser Bars -->
  <path d="M 176,176 L 336,176 M 176,256 L 304,256 M 176,336 L 336,336 M 176,176 L 176,336" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonFilter)"/>
  <!-- Glowing Center Beacon -->
  <circle cx="256" cy="256" r="16" fill="#00f0ff" filter="url(#neonFilter)"/>
</svg>
